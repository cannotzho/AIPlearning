{% extends 'base.html' %}

{% block head %}
<h1>Video Upload Page</h1>
{% endblock %}

{% block body %}
<a href = "/reset_all">Delete all rows in video table</a>
<div class = "upload">
  <form action="/api/process" method="POST" enctype="multipart/form-data">
    <label for="video-upload">Choose a video to upload:</label>
    <input type="file" id="video-upload" name="video" accept="video/*">
    <br>
    <input type="submit" value="Upload Video">
  </form>
</div>

<div class = "content">
  <table>
    <tr>
      <th>Video Name</th>
      <th>Thumbnail</th>
      <th>Date Submitted</th>
    </tr>
    {% for video in videos %}
    <tr>
      <td><a href = "/api/videos/{{video.rowid}}">{{ video.uri }}</href></td>
      <td>{{ video.filename }}</td>
      <td>{{ video.created.date() }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
